  # ── Covariance demo export (offline, no GPU) ─────────────────────────────
  - name: covariance_demo
    description: >-
      Per-frame *inputs* of both covariance estimators, exported for an
      interactive page that recomputes sigma^2 (J^T W J)^-1 in the browser:
      the keypoint branch's RANSAC inliers (re-run offline from the stored LoMa
      matches, same USAC_MAGSAC seed/threshold as the tracker) and the mask
      branch's template boundary plus the frame's SAM3 mask. `scan` ranks frames
      by how much the four per-corner sigmas differ; `export` writes the payload.
      Substrate is the loma_v2 npz + sam3_candidate_dump masks, so it needs no
      GPU and no tracker rerun. Cross-checking the export under node is what
      surfaced the xy-major/corner-major block-slicing bug in
      mask_align._corner_cov_from_boundary_fit (docs/journal.md 2026-08-18).
    status: experimental
    runner: "python experiments/covariance_demo_export.py export --frames V01_5:106 --out demo.json"
    slurm: >-
      python slurm/submit_cmd.py --gpus 0 --no-mail -- python
      experiments/covariance_demo_export.py export --frames V01_5:106 --out demo.json
    datasets: [pot]
    active_configs: []
    completeness:
