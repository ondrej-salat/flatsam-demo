    evaluator: null

  - name: paper_overview
    description: >-
      Static FlatSAM2 method diagram used by the WACV paper. Encodes shared
      masks, two independent pose states, raw-match corner naming and the final
      inlier-count selection rule; reads no experiment outputs.
    status: active
    runner: "python experiments/paper_overview.py"
    slurm: null
    datasets: [pti]
    active_configs: []
    completeness:
      - "{OUTPUT_DIRECTORY}/experiments/paper_overview/overview.pdf"
    evaluator: null

  # ── Switch-threshold sensitivity (offline, no GPU) ───────────────────────
  - name: inlier_threshold_sweep
    description: >-
      Is the quad-based tracker's `inliers >= 35` switch a tuned constant? Reads
      each run's stored branch homographies and inlier counts, reconstructs the
      rule and sweeps the threshold. Self-checks against the run's own
      `selected` array before reporting (100.00% agreement on PTi and POT, and
      pooled P@15 at T=35 reproduces the recorded 88.05 / 98.51). Result
      (docs/journal.md 2026-08-19): T=35 sits on a broad plateau -- PTi moves
      0.25 pp over T in [25, 80], POT does not move -- so the number is not
      load-bearing. It does not address the per-frame cliff objection, which is
      what the corner_fusion branch exists for. Prints to stdout; no artifact.
    status: experimental
    runner: "python experiments/inlier_threshold_sweep.py {dataset} --config {config}"
    slurm:  "python slurm/submit_cmd.py --gpus 0 --no-mail -- python experiments/inlier_threshold_sweep.py {dataset} --config {config}"
    datasets: [pti, pot]
    active_configs:
      - configs/tracker/loma_samh_matchnaming.py
    completeness: []
    evaluator: null

  # ── tau sensitivity of the corner namer (train split) ────────────────────
  - name: tau_ablation
    description: >-
      Is `symmetry.match_tau_px = 30` a tuned constant? Unlike the inherited
      35-inlier threshold, tau is this method's own parameter, so it is swept on
      the PlanarTrack **train** split (`configs/subsets/pt_trn_50.txt`) -- a sweep
      on the reported test benchmark would be selecting on test. The tracking
      re-run exists only to record telemetry the published grid does not have:
      `naming_hist_counts` / `naming_hist_sumsq` were written by the registrar
      path only until 2026-08-25 (commit 55f63b9), so on the deployed `hough`
      path they were structurally zero. With them the truncated support
      `sum max(0, 1 - d^2/tau^2)` is recoverable exactly at every swept bin edge
      (3, 5, 7, 10, 15, 20, 30, 50, 100 px), so `experiments/naming_rule_replay.py`
      scores every tau -- plus margin, effective-support, and raw-match guards --
      offline with no GPU. Tau sweeps retain the deployed eight-match minimum;
      raw-match sensitivity is reported separately at the deployed tau.
      Written to a separate output root so it cannot touch the published grid.
      The claim is the flatness, never the argmax (docs/journal.md 2026-08-19,
      "split hygiene on the threshold sweep").
    status: active
    runner: "python run.py planartrack --split train --subset pt_trn_50 --config {config} --output-dir {OUTPUT_DIRECTORY}/tau_ablation"
    slurm:  "python slurm/submit.py planartrack --split train --subset pt_trn_50 --config {config} --output-dir {OUTPUT_DIRECTORY}/tau_ablation --jobs 50 --time 1:30:00 --partition amdgpu,gpu --no-mail"
    datasets: [planartrack_train]
    sequence_subset: configs/subsets/pt_trn_50.txt
    active_configs:
      - configs/tracker/loma_samh_matchnaming.py
    completeness:
      - "{OUTPUT_DIRECTORY}/tau_ablation/{config_stem}/{dataset_label}/{seq_name}_debug.npz"
    evaluator:
      command: "python experiments/naming_rule_replay.py planartrack --split train --config {config} --results-dir {OUTPUT_DIRECTORY}/tau_ablation"
      output:  null

  # ── Cross-hardware reproducibility ───────────────────────────────────────
  - name: determinism_check
    description: >-
      What does a re-run of the shipped config reproduce? Measured 2026-08-25:
      two runs on the same node are bit-identical (`ransac_seed` is fixed), but a
      run on a different GPU generation (V100 `gpu` vs the grid's A100 `amdgpu`)
      diverges from frame 1 and by up to 1494 px, moving per-sequence P@15 by
      -0.60 / -0.33 / +2.23 pp on three sequences -- SAM3/LoMa kernels differ and
      the tracker is autoregressive. Consequence: grids must be compared in
      aggregate, never cell-by-cell across partitions. The 20-sequence re-run
      (`pti_fusion_probe20`) gives the paper's reproducibility sentence an
      aggregate figure; `$OUTPUT_DIRECTORY/scratch/det_impact.py` prints the
      per-sequence table against the published grid.
    status: active
    runner: "python run.py pti --subset pti_fusion_probe20 --config {config} --output-dir {OUTPUT_DIRECTORY}/determinism_check/probe20 --no-skip-completed"
    slurm:  "python slurm/submit.py pti --subset pti_fusion_probe20 --config {config} --output-dir {OUTPUT_DIRECTORY}/determinism_check/probe20 --jobs 20 --time 1:30:00 --partition amdgpu,gpu --no-mail --no-skip-completed --no-eval"
    datasets: [pti]
    sequence_subset: configs/subsets/pti_fusion_probe20.txt
    active_configs:
      - configs/tracker/loma_samh_matchnaming.py
    completeness:
      - "{OUTPUT_DIRECTORY}/determinism_check/probe20/{config_stem}/{dataset_label}/{seq_name}.txt"
    evaluator: null

  # ── Mask -> homography estimator benchmark (offline, no GPU) ─────────────
  - name: maskh_bench
    description: >-
      Fixed offline test set for the SAM-H branch's core question (template
      silhouette + this frame's mask -> where is the object?), with the
      *initialization* as a controlled variable: good (GT + 5 px), drift (GT +
      30 px), lost (another frame's GT pose), cold (the template pose). Every
      estimator sees byte-identical inputs, so a comparison costs minutes
      instead of a full tracking grid, and recovery ability is separated from
      alignment accuracy. Sequences are split dev/test by name hash — tune on
      dev, report on test. See docs/2026-08-07.md (2026-08-11 entries).
    status: active
    # Substrate: the sam3_candidate_dump masks + dataset GT + frames. No GPU and
    # no tracker rerun, but it imports cv2, so it goes to the cpu partition.
    runner: "python experiments/maskh_bench.py build && python experiments/maskh_bench.py run"
    slurm: >-
      python slurm/submit_cmd.py --gpus 0 --cpus 16 -- python experiments/maskh_bench.py
      run --methods hough align_redetect register --out results.csv
    datasets: [pot, pti]
    # Estimators are named inside the script (METHODS + mask_register.bench_methods),
    # not by config file, so there is no config variant to list.
    active_configs: []
    completeness:
      - "{OUTPUT_DIRECTORY}/experiments/maskh_bench/testset_v1.json"
    evaluator:
      command: "python experiments/maskh_bench.py run --split test"
      output:  "{OUTPUT_DIRECTORY}/experiments/maskh_bench/register_test.csv"
    # Paper ablation table: every `abl_*` method in mask_register.bench_methods()
    # is one axis (verifier evidence, proposal source, arbitration, refinement
    # depth, raster resolution, occlusion trimming), run over one pass of the
    # held-out split:
    #   python experiments/maskh_bench.py run --split test \
    #     --extra-h-run corner_fusion_register --out ablations_test.csv

  # ── Paper experiments: timing and result tables (offline, no GPU) ────────
  - name: paper_tables
    description: >-
      The non-tracking experiments a write-up needs, all read off completed
      runs so nothing is recomputed. `maskh_timing` is the publishable cost
      measurement: one process, one thread (cv2 and BLAS both pinned), warm-up
      discarded, median of repeated trials, plus the registrar's internal stage
      breakdown via flatsam2.profiling — the maskh_bench `ms` column is 16-way
      contended and only its ratios are meaningful. `results_tables` formats
      the headline precision table, the POT-210 per-condition breakdown (read
      from the dataset's own splits/*.txt, not guessed from name suffixes), and
      accuracy against SAM3 mask quality. Ablations themselves are methods
      inside maskh_bench (see the `maskh_bench` pipeline, prefix `abl_`).
    status: active
    runner: "python experiments/maskh_timing.py && python experiments/results_tables.py"
    slurm: >-
      python slurm/submit_cmd.py --gpus 0 --cpus 4 -- python experiments/maskh_timing.py
      --cases 150 --repeats 3 --stages
    datasets: [pot, pti]
    active_configs: []
    completeness:
      - "{OUTPUT_DIRECTORY}/experiments/maskh_bench/timing.json"
    evaluator: null

